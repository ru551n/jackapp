name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: node scripts/speech/collect.mjs
      - uses: actions/cache@v4
        with:
          path: |
            .voices
            public/audio
          key: speech-${{ hashFiles('scripts/speech/voices.json', '.speech/phrases.json') }}
          restore-keys: speech-
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
